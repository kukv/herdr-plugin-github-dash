version: "2"

linters:
  default: standard
  enable:
    - revive
    - gosec
    - misspell
    - gocritic
    - bodyclose
    - unconvert
    - unparam
    - depguard
  settings:
    depguard:
      rules:
        # The GitHub access layer must not know about the UI.
        gh-layer:
          files:
            - "**/internal/gh/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/ui
              desc: the GitHub layer must not depend on the UI
            - pkg: github.com/kukv/octoscope/internal/tui
              desc: the GitHub layer must not depend on the UI
        # Messages are a leaf: they depend on nothing of ours.
        i18n-layer:
          files:
            - "**/internal/i18n/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/gh
              desc: internal/i18n must not depend on other internal packages
            - pkg: github.com/kukv/octoscope/internal/ui
              desc: internal/i18n must not depend on other internal packages
            - pkg: github.com/kukv/octoscope/internal/tui
              desc: internal/i18n must not depend on other internal packages
            - pkg: github.com/kukv/octoscope/internal/config
              desc: internal/i18n must not depend on other internal packages
        # Views are siblings: a view must not reach into another view's model,
        # and no child may import its parent.
        tui-work:
          files:
            - "**/internal/tui/work/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/tui/repo
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/tui/detail
              desc: sibling views communicate through the app model, not directly
            - pkg: github.com/kukv/octoscope/internal/tui/app
              desc: a child view must not import its parent
  exclusions:
    rules:
      - linters:
          - revive
        text: "^(exported|unused-parameter):"
      - path: _test\.go
        linters:
          - gosec
      # gosec G204 flags exec.Command whenever its args are not literal
      # constants. internal/gh/cli exists specifically to run "gh" with a
      # dynamic subcommand and flags built from typed values (see the
      # comment at the call site); there is exactly one call site, and no
      # amount of restructuring removes the "args are a variable" shape the
      # rule matches on. Excluding it here keeps the exception in one place
      # instead of a scattered //nolint.
      - path: internal/gh/cli/cli\.go
        linters:
          - gosec
        text: "G204"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
