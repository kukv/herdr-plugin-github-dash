version: "2"

linters:
  default: standard
  enable:
    - revive
    - gosec
    - misspell
    - gocritic
    - bodyclose
    - unconvert
    - unparam
    - depguard
  settings:
    depguard:
      rules:
        # The GitHub access layer must not know about the UI.
        gh-layer:
          files:
            - "**/internal/ghcli/**"
            - "**/internal/gh/**"
          deny:
            - pkg: github.com/kukv/octoscope/internal/ui
              desc: the GitHub layer must not depend on the UI
            - pkg: github.com/kukv/octoscope/internal/tui
              desc: the GitHub layer must not depend on the UI
        # Messages are a leaf: they depend on nothing of ours.
        i18n-layer:
          files:
            - "**/internal/i18n/**"
            - "!$test"
          deny:
            - pkg: github.com/kukv/octoscope/internal
              desc: internal/i18n must not depend on other internal packages
  exclusions:
    rules:
      - linters:
          - revive
        text: "^(exported|unused-parameter):"
      - path: _test\.go
        linters:
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
